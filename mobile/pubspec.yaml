name: lumora_mobile
description: "Lumora — Language Learning, Reimagined. Flutter client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Design / fonts
  google_fonts: ^6.2.1

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  camera: ^0.11.0+2
  permission_handler: ^11.3.1

  # Speech
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0

  # Payments checkout (Paystack webview)
  webview_flutter: ^4.10.0

  # Misc
  confetti: ^0.8.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  intl: ^0.19.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
